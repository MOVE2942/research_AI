<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative Reference Archive</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#111827}header,main{max-width:1200px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111827}.body{padding:14px}.prompt{white-space:pre-wrap;background:#f1f5f9;padding:10px;border-radius:8px;font-size:13px}.tags{color:#475569;font-size:13px}.source{display:inline-block;margin-top:10px;background:#2563eb;color:#fff;text-decoration:none;padding:8px 10px;border-radius:7px}</style></head><body><header><h1>Creative Reference Archive</h1><p id="meta"></p></header><main><div id="grid" class="grid"></div></main><script>fetch('data/latest.json',{cache:'no-store'}).then(r=>r.json()).then(p=>{document.getElementById('meta').textContent=`${p.cards.length} cards · ${p.release_id}`;const grid=document.getElementById('grid');p.cards.forEach(c=>{const a=document.createElement('article');a.className='card';const img=document.createElement('img');img.className='thumb';img.src=c.visual.src;img.alt=c.visual.alt;a.append(img);const b=document.createElement('div');b.className='body';const h=document.createElement('h2');h.textContent=c.title;b.append(h);const tags=document.createElement('div');tags.className='tags';tags.textContent=c.tags.map(t=>'#'+t).join(' ');b.append(tags);const s=document.createElement('p');s.textContent=c.summary;b.append(s);const label=document.createElement('h3');label.textContent='Prompt';b.append(label);const prompt=document.createElement('div');prompt.className='prompt';prompt.textContent=c.prompt.status==='captured'?c.prompt.text:(c.prompt.status==='not_applicable'?'해당 없음':'원문에서 프롬프트를 확인하지 못했습니다. 원문 링크에서 확인하세요.');b.append(prompt);const link=document.createElement('a');link.className='source';link.href=c.source.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='원문 보기';b.append(link);a.append(b);grid.append(a)})})</script></body></html>
